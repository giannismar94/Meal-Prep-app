<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Πεταλούδα">
<meta name="description" content="Διατροφή, νερό, κίνηση και στόχοι — με τη Λίλα την πεταλούδα.">
<title>Πεταλούδα</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f1; --card:#ffffff; --ink:#2e2638; --muted:#7b7088; --line:#efe7ee;
  --lilac:#8a6cd6; --lilac-d:#6a4fb8; --lilac-s:#f1ebfc;
  --peach:#ff9677; --peach-d:#e26f4f; --peach-s:#ffede6;
  --mint:#2fa77c; --mint-s:#e2f4ec;
  --water:#3d9be0; --water-s:#e5f2fc;
  --warn:#c97a14; --warn-s:#fdf1de;
  --r:22px;
  --shadow:0 1px 2px rgba(46,38,56,.04),0 8px 24px rgba(46,38,56,.07);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20vh -20vw auto auto;width:70vw;height:70vw;max-width:520px;max-height:520px;border-radius:50%;background:radial-gradient(circle,rgba(138,108,214,.13),transparent 65%);pointer-events:none;z-index:0}
body:after{content:"";position:fixed;left:-25vw;bottom:5vh;width:70vw;height:70vw;max-width:480px;max-height:480px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,119,.12),transparent 65%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
h1,h2,h3{font-family:Comfortaa,Manrope,system-ui,sans-serif;margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(100px + var(--safe-b))}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.02em}
.hello h1{font-size:23px;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none;color:var(--lilac-d)}
.iconbtn svg{width:22px;height:22px}
.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:5px;margin-bottom:14px;box-shadow:var(--shadow)}
.datebar button{width:42px;height:36px;border-radius:13px;display:grid;place-items:center;color:var(--lilac-d)}
.datebar button:active{background:var(--lilac-s)}
.datebar button:disabled{opacity:.22}
.datebar .dl{font-weight:800;font-size:15px;text-align:center}
.datebar .dl small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;position:relative}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .sub{font-family:Manrope,system-ui,sans-serif;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.section-title{font-family:Comfortaa,Manrope,sans-serif;font-weight:700;font-size:15px;color:var(--muted);margin:22px 4px 10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:15px;font-weight:800;font-size:14.5px;background:var(--lilac-s);color:var(--lilac-d);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,#9a7ee0,var(--lilac-d));color:#fff;box-shadow:0 6px 16px rgba(106,79,184,.28)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 6px 16px rgba(47,167,124,.25)}
.btn.peach{background:var(--peach-s);color:var(--peach-d)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.danger{background:#fde8e6;color:#b8392a}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--lilac-s);color:var(--lilac-d)}
.chip.warn{background:var(--warn-s);color:var(--warn)}
.chip.mint{background:var(--mint-s);color:var(--mint)}
.chip.peach{background:var(--peach-s);color:var(--peach-d)}

/* mascot */
.mascot{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#efe6fd 0%,#fbe9f1 55%,#ffeee4 100%);overflow:hidden}
.mascot .pic{width:108px;flex:none;align-self:flex-end;margin:-4px -2px -10px -6px}
.mascot .pic svg{width:100%;height:auto;display:block;animation:bob 3.4s ease-in-out infinite}
.mascot .talk{flex:1;min-width:0}
.bubble{position:relative;background:#fff;border-radius:18px;padding:11px 13px;font-weight:700;font-size:14.5px;line-height:1.4;box-shadow:0 4px 14px rgba(106,79,184,.08);animation:pop .35s ease-out}
.bubble:before{content:"";position:absolute;left:-8px;bottom:16px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.stage{margin-top:10px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--lilac-d)}
.stage span{color:var(--muted);font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--peach));border-radius:99px;transition:width .6s ease}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1deg)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.wing{transform-box:view-box;transform-origin:60px 66px;animation:flap 2.2s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8)}}
.sparkle{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sparkle:nth-child(2){animation-delay:.5s}.sparkle:nth-child(3){animation-delay:1s}
@keyframes twinkle{50%{transform:scale(.5);opacity:.4}}

/* summary ring */
.sum{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .track{stroke:var(--lilac-s)}
.ring .val{stroke:url(#rg);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring.over .val{stroke:var(--peach)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ring .mid small{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px}
.minis{flex:1;display:grid;gap:12px}
.mini .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.mini .lab span{color:var(--muted)}
.mbar{height:9px;border-radius:99px;background:var(--lilac-s);overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;border-radius:99px;background:var(--lilac);transition:width .6s ease}
.mbar.p{background:var(--peach-s)}.mbar.p i{background:var(--peach)}
.mbar.w{background:var(--water-s)}.mbar.w i{background:var(--water)}
.mbar.m{background:var(--mint-s)}.mbar.m i{background:var(--mint)}

/* water */
.glasses{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.glass{aspect-ratio:4/5;border-radius:6px 6px 12px 12px;background:var(--water-s);position:relative;overflow:hidden;transition:transform .15s;clip-path:polygon(3% 0,97% 0,85% 100%,15% 100%)}
.glass:active{transform:scale(.92)}
.glass i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#7cc0f0,var(--water));transition:height .35s cubic-bezier(.2,.9,.3,1.2)}
.glass.on i{height:82%}
.glass.on:after{content:"";position:absolute;left:22%;top:26%;width:14%;height:30%;border-radius:9px;background:rgba(255,255,255,.45)}
.waterhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.waterhead b{font-size:24px;font-weight:800;color:var(--water);letter-spacing:-.02em}
.waterhead b small{font-size:14px;color:var(--muted);font-weight:700}
.wbtns{display:flex;gap:8px}
.wbtns .btn{background:var(--water-s);color:#1f7ac0;min-height:38px;padding:0 12px}

/* goals */
.goal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .chk{width:28px;height:28px;border-radius:10px;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #e2d9ea;transition:all .2s}
.goal .chk svg{width:16px;height:16px;color:#fff}
.goal.done .chk{background:var(--mint);box-shadow:none;animation:pop .3s}
.goal.miss .chk{background:#fbe9e6;box-shadow:none;color:#c9533f;font-weight:800;font-size:14px}
.goal .gl{flex:1;font-weight:700;font-size:15px}
.goal.done .gl{color:var(--muted)}
.goal .gl small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.goal .em{font-size:20px;width:26px;text-align:center}

/* meals */
.meal{padding:0;overflow:hidden;transition:box-shadow .2s}
.meal .mh{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.meal .emo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:var(--peach-s);flex:none}
.meal .slot{font-size:12px;font-weight:800;color:var(--lilac-d);text-transform:uppercase;letter-spacing:.06em}
.meal h3{font-size:16px;margin-top:3px;font-family:Manrope,system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}
.meal .body{padding:6px 16px 14px}
.ing{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.ing li{display:flex;gap:8px;font-size:14px}
.ing li b{min-width:62px;font-weight:800;color:var(--ink)}
.ing li span{color:#4d4459}
.mnums{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.tip{margin-top:10px;font-size:13px;color:var(--muted);background:#faf7fd;border-radius:12px;padding:8px 10px}
.mact{display:flex;gap:8px;padding:0 16px 16px}
.mact .btn{flex:1}
.mact .btn.icon{flex:none;width:44px;padding:0}
.meal.eaten{box-shadow:0 0 0 2px var(--mint),var(--shadow)}
.meal.eaten .emo{background:var(--mint-s)}
.meal.eaten .ate{display:flex;align-items:center;gap:6px;color:var(--mint);font-weight:800;font-size:13px}
.extra{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.extra:last-of-type{border-bottom:0}
.x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:#f6f2f8;font-size:18px;flex:none}

/* picker rows */
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);margin-bottom:8px;box-shadow:var(--shadow)}
.prow .pe{font-size:24px;width:42px;height:42px;border-radius:14px;background:var(--peach-s);display:grid;place-items:center;flex:none}
.prow .pn{flex:1;min-width:0;text-align:left}
.prow .pn b{display:block;font-size:14.5px;line-height:1.3}
.prow .pn small{color:var(--muted);font-weight:700;font-size:12.5px}
.prow.cur{box-shadow:0 0 0 2px var(--lilac),var(--shadow)}
.heart{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#d4c8dd;flex:none}
.heart.on{color:#ef5f7f}
.heart svg{width:20px;height:20px}

/* exercise */
.ex-hero{background:linear-gradient(135deg,#e6f6ef,#eef3fd);}
.ex-hero .big{font-size:44px;line-height:1}
.ex-hero h3{font-size:19px}
.steps{list-style:none;padding:0;margin:12px 0 0;counter-reset:s}
.steps li{position:relative;padding:8px 0 8px 36px;font-size:14.5px;border-bottom:1px dashed #dfe9e4}
.steps li:last-child{border-bottom:0}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:8px;background:#fff;color:var(--mint);font-weight:800;font-size:12.5px;display:grid;place-items:center}
.week{display:grid;gap:8px}
.wd{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#faf7fd}
.wd.today{background:var(--lilac-s);box-shadow:inset 0 0 0 1.5px var(--lilac)}
.wd .dn{width:38px;font-weight:800;font-size:13px;color:var(--muted)}
.wd .we{font-size:20px}
.wd .wn{flex:1;font-weight:700;font-size:14px}
.wd .ok{color:var(--mint);font-weight:800}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#faf7fd;border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.stat small{font-size:11.5px;color:var(--muted);font-weight:700}
.chart{width:100%;height:auto;display:block;overflow:visible}
.grid14{display:grid;gap:4px;align-items:center;font-size:11px}
.grid14 .dot{width:100%;aspect-ratio:1;border-radius:6px;background:#f3eef6}
.grid14 .dot.done{background:var(--mint)}
.grid14 .dot.miss{background:#f6d9d3}
.grid14 .dot.pending{background:#f3eef6;box-shadow:inset 0 0 0 1.5px #d9cfe3}
.grid14 .hd{text-align:center;color:var(--muted);font-weight:800}
.grid14 .gname{font-size:16px;text-align:center}
.wlist .wi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.wlist .wi:last-child{border-bottom:0}

/* forms */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 6px 4px}
.input{width:100%;height:50px;border-radius:15px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-weight:700;outline:none;transition:border .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--lilac);box-shadow:0 0 0 4px var(--lilac-s)}
.input.unit{padding-right:48px}
.uwrap{position:relative}
.uwrap em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#f3eef6;border-radius:15px;padding:4px;gap:4px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px 6px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted);transition:all .2s}
.seg input:checked+span{background:#fff;color:var(--lilac-d);box-shadow:0 2px 8px rgba(46,38,56,.08)}
.opts{display:grid;gap:8px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;padding:12px 14px;border-radius:15px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:14.5px;transition:all .2s}
.opt span small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.opt input:checked+span{box-shadow:inset 0 0 0 2px var(--lilac);background:var(--lilac-s)}
.err{background:#fdecea;color:#a8321f;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.note{background:var(--warn-s);color:#8a5410;border-radius:14px;padding:10px 12px;font-weight:600;font-size:13.5px}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);font-weight:700}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:#e3dbe8;position:relative;transition:background .2s;cursor:pointer;flex:none}
.switch input:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:var(--lilac)}
.switch input:checked:after{transform:translateX(20px)}

/* onboarding */
.ob{padding-top:10px}
.ob .hero{text-align:center;padding:10px 6px 4px}
.ob .hero svg{width:150px;height:auto;animation:bob 3.4s ease-in-out infinite}
.ob .hero h1{font-size:28px;margin-top:4px}
.ob .hero p{color:var(--muted);font-weight:600;margin-top:8px}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg{border-radius:18px;padding:14px;background:#faf7fd}
.tg b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.tg small{font-weight:700;color:var(--muted);font-size:12.5px}
.tg.a{background:var(--lilac-s)}.tg.a b{color:var(--lilac-d)}
.tg.b{background:var(--peach-s)}.tg.b b{color:var(--peach-d)}
.tg.c{background:var(--water-s)}.tg.c b{color:#1f7ac0}
.tg.d{background:var(--mint-s)}.tg.d b{color:var(--mint)}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + var(--safe-b));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(46,38,56,.14),0 0 0 1px rgba(46,38,56,.04)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:7px 0 6px;border-radius:18px;transition:all .2s}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--lilac-d);background:var(--lilac-s)}

/* sheet & toast */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(30,22,40,.38);animation:fade .2s}
.sheet{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:90dvh;overflow:auto;border-radius:28px 28px 0 0;padding:8px 16px calc(24px + var(--safe-b));animation:up .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet h2{font-size:20px;margin:4px 2px 14px}
.grab{width:42px;height:5px;border-radius:9px;background:#d9cfe0;margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#2e2638;color:#fff;padding:11px 16px;border-radius:16px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .25s;max-width:calc(100vw - 32px);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}

.fadein{animation:fadein .3s ease-out}

function calcTargets(p, w){
  const bmr = 10*w + 6.25*p.height - 5*p.age + (p.sex==='m'?5:-161);
  const tdee = bmr*ACT[p.activity].f;
  const floor = p.sex==='m'?1500:1200;
  let maintenance = w <= p.goalWeight + 0.05;
  let def = maintenance?0:Math.min(Number(p.pace)*7700/7, tdee*0.25);

  if(kcal<floor){kcal=floor;floored=true;}
  if(p.kcalOverride){ kcal=Math.max(floor, Math.round(p.kcalOverride/10)*10); }
  const protein = Math.round(1.6*((w+p.goalWeight)/2)/5)*5;
  const water = Math.max(2000, Math.round(w*30/250)*250);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein,water,floored,maintenance,floor};
}

function scaleMeal(m, target){
  if(m.custom) return {items:[],kcal:Math.round(m.kcal),p:Math.round(m.p||0)};
  let fixed=0, sc=0;
  m.i.forEach(([f,q,s])=>{const k=itemK(f,q); s?sc+=k:fixed+=k;});

  return {items,kcal:Math.round(items.reduce((a,x)=>a+itemK(x.f,x.q),0)),p:Math.round(items.reduce((a,x)=>a+itemP(x.f,x.q),0))};

  const wt=waterTarget(k), expected=clamp((h-8)/12,0,1)*wt;
  if(totals(k).kcal > tg.kcal*1.05) return ['Πέρασες λίγο τις θερμίδες σήμερα — δεν πειράζει καθόλου, αύριο συνεχίζουμε κανονικά 💜','happy'];
  if(h<11 && !(d.eaten&&d.eaten.b)) return [`Καλημέρα${name?' '+name:''}! ☀️ Το πρωινό σου σε περιμένει στο «Φαγητό».`,'happy'];
  if(d.water < expected-500) return [pick([`Πάμε ένα ποτήρι νερό; 💧 Είσαι στα ${liters(d.water)} από ${liters(wt)}.`,'Λίγο νεράκι; Το σώμα σου θα σε ευχαριστήσει 💧']),'happy'];
  if(h>=16 && !exFor(k).done){ const e=exFor(k).w; return [`Η σημερινή κίνηση: ${e.e} ${e.n}, ${e.min}′. Πάμε μαζί; 💪`,'happy']; }
  if(h>=22) return ['Καληνύχτα! Ο καλός ύπνος είναι κι αυτός μέρος του πλάνου 🌙','sleepy'];
  return [pick(ENCOURAGE),'happy'];
}

function weightChart(){
  const e=weightEntries(), p=S.profile;
  const pts=[{k:p.startDate,w:p.startWeight},...e.filter(x=>x.k!==p.startDate)].sort((a,b)=>a.k<b.k?-1:1);
  if(e.length && e.find(x=>x.k===p.startDate)) pts.find(x=>x.k===p.startDate).w=e.find(x=>x.k===p.startDate).w;
  if(pts.length<2) return `<p class="small muted">Πρόσθεσε ζυγίσματα για να δεις το γράφημα. Ξεκίνησες από <b>${kg(p.startWeight)} kg</b>.</p>`;
  const Wd=320,H=150,pl=34,pr=10,pt=12,pb=22;
  const t0=parseKey(pts[0].k).getTime(), t1=parseKey(pts[pts.length-1].k).getTime()||t0+1;
  const ws=pts.map(x=>x.w).concat([p.goalWeight]);
  const mn=Math.floor(Math.min(...ws)-1), mx=Math.ceil(Math.max(...ws)+1);
  const X=k=>pl+(t1===t0?0:(parseKey(k).getTime()-t0)/(t1-t0))*(Wd-pl-pr);
  const Y=w=>pt+(mx-w)/(mx-mn)*(H-pt-pb);
  const path=pts.map((x,i)=>`${i?'L':'M'}${X(x.k).toFixed(1)} ${Y(x.w).toFixed(1)}`).join(' ');
  const area=`${path} L${X(pts[pts.length-1].k).toFixed(1)} ${H-pb} L${X(pts[0].k).toFixed(1)} ${H-pb} Z`;
  const ticks=[mn,Math.round((mn+mx)/2),mx];
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}">
    <defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6cd6" stop-opacity=".25"/><stop offset="1" stop-color="#8a6cd6" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#efe7ee"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#7b7088" font-weight="700">${v}</text>`).join('')}
    <line x1="${pl}" x2="${Wd-pr}" y1="${Y(p.goalWeight)}" y2="${Y(p.goalWeight)}" stroke="#2fa77c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="${Wd-pr}" y="${Y(p.goalWeight)-5}" text-anchor="end" font-size="10" fill="#2fa77c" font-weight="800">στόχος ${kg(p.goalWeight)}</text>
    <path d="${area}" fill="url(#wa)"/>
    <path d="${path}" fill="none" stroke="#8a6cd6" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((x,i)=>`<circle cx="${X(x.k)}" cy="${Y(x.w)}" r="${i===pts.length-1?4.5:3}" fill="#fff" stroke="#8a6cd6" stroke-width="2"/>`).join('')}
    <text x="${pl}" y="${H-6}" font-size="10" fill="#7b7088" font-weight="700">${dateLabel(pts[0].k)}</text>
    <text x="${Wd-pr}" y="${H-6}" text-anchor="end" font-size="10" fill="#7b7088" font-weight="700">${dateLabel(pts[pts.length-1].k)}</text>
  </svg>`;
}
function kcalChart(){

  const e=weightEntries(), t=todayKey();
  const avg=(a,b)=>{const xs=e.filter(x=>x.k>a&&x.k<=b).map(x=>x.w);return xs.length?xs.reduce((s,v)=>s+v,0)/xs.length:null};
  const a1=avg(addDays(t,-7),t), a0=avg(addDays(t,-14),addDays(t,-7));
  const weeks = need>0?Math.ceil(Math.max(0,cw-p.goalWeight)/Number(p.pace)):0;
  return `
    <div class="card">
      <h2>🦋 Πορεία προς τον στόχο <span class="sub">${Math.round(pct*100)}%</span></h2>

function readProfile(form){
  const f=new FormData(form), g=n=>f.get(n);
  const r={name:String(g('name')||'').trim().slice(0,20),sex:g('sex')||'f',age:num(g('age')),height:num(g('height')),weight:num(g('weight')),goal:num(g('goal')),activity:g('activity')||'light',pace:String(g('pace')||'0.5')};
  if(!(r.age>=18&&r.age<=90)) return {err:'Βάλε ηλικία από 18 έως 90.'};
  if(!(r.height>=130&&r.height<=215)) return {err:'Βάλε ύψος σε εκατοστά (π.χ. 165).'};
  if(!(r.weight>=35&&r.weight<=250)) return {err:'Βάλε το τωρινό βάρος σε κιλά.'};
  if(!(r.goal>=35&&r.goal<=250)) return {err:'Βάλε το βάρος-στόχο σε κιλά.'};
  const minHealthy=Math.ceil(18.5*(r.height/100)**2*10)/10;
  if(r.goal<minHealthy) return {err:`Ο στόχος είναι κάτω από το υγιές εύρος για ύψος ${r.height} cm. Το χαμηλότερο υγιές βάρος είναι περίπου ${kg(minHealthy)} kg.`};
  if(r.goal>r.weight) return {err:'Ο στόχος είναι πάνω από το τωρινό βάρος. Η εφαρμογή είναι φτιαγμένη για απώλεια βάρους.'};
  return {r};
}

let toastT;
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
function confetti(){
  const c=document.createElement('div'); c.className='confetti';
  const cols=['#8a6cd6','#ff9677','#2fa77c','#ffc94d','#3d9be0','#ef5f7f'];
  for(let i=0;i<60;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=pick(cols);s.style.animationDelay=Math.random()*.5+'s';s.style.animationDuration=(1.2+Math.random()*1.2)+'s';c.appendChild(s);}
  document.body.appendChild(c); setTimeout(()=>c.remove(),3000);
}
function allDoneCheck(before){
  const k=viewDate; if(k!==todayKey()) return;
  const after=S.goals.every(g=>goalState(g,k)==='done');
  if(after&&!before){ confetti(); toast('Όλοι οι στόχοι της μέρας! 🎉'); }
  const s0=stageOf(window._pts||0), p1=points(), s1=stageOf(p1);
  if(s1>s0&&window._pts!=null){ setTimeout(()=>{ confetti(); toast(`Η Λίλα έγινε ${STAGES[s1].n}! 🦋`); },400); }
  window._pts=p1;
}
function mutate(fn){
  const before = S.goals.every(g=>goalState(g,viewDate)==='done');
  fn(); save(); render(); allDoneCheck(before);
}

  closeSheet(){ closeSheet(); },
  mascot(){ const b=$('#bubble'); if(b){ b.textContent=pick(ENCOURAGE); b.style.animation='none'; b.offsetHeight; b.style.animation=''; } },
  water(el){ mutate(()=>{ const d=day(viewDate); d.water=Math.max(0,d.water+Number(el.dataset.v)); }); },
  glass(el){ mutate(()=>{ const d=day(viewDate), v=(Number(el.dataset.i)+1)*250; d.water = d.water===v? v-250 : v; }); },

  },
  eat(el){ mutate(()=>{ const d=day(viewDate), s=SLOTS.find(x=>x.id===el.dataset.slot), m=mealById(d.plan[s.id]), sc=scaleMeal(m,slotTarget(s)); d.eaten[s.id]={id:m.id,n:m.n,e:m.e,kcal:sc.kcal,p:sc.p}; }); toast('Καλή όρεξη! 😋'); },
  uneat(el){ mutate(()=>{ delete day(viewDate).eaten[el.dataset.slot]; }); },
  reroll(el){ mutate(()=>{ const d=day(viewDate), s=SLOTS.find(x=>x.id===el.dataset.slot); d.plan[s.id]=pickMeal(s,viewDate,d.plan[s.id]); }); },
  picker(el){ openPicker(el.dataset.slot); },
  choose(el){ const id=el.dataset.id; mutate(()=>{ day(viewDate).plan[pickerSlot]=id; }); closeSheet(); },
  fav(el){ const id=el.dataset.id; S.prefs.fav[id]=!S.prefs.fav[id]; if(!S.prefs.fav[id]) delete S.prefs.fav[id]; save(); openPicker(pickerSlot); render(); },
  hide(el){ const id=el.dataset.id, s=SLOTS.find(x=>x.id===pickerSlot); const left=MEALS.filter(m=>m.t===s.t&&!S.prefs.hide[m.id]&&m.id!==id); if(!left.length){toast('Κράτα τουλάχιστον μία επιλογή 🙂');return;} S.prefs.hide[id]=true; delete S.prefs.fav[id]; const d=day(viewDate); if(d.plan[pickerSlot]===id&&!d.eaten[pickerSlot]) d.plan[pickerSlot]=pickMeal(s,viewDate,id); save(); openPicker(pickerSlot); render(); toast('Δεν θα σου το ξαναπροτείνω'); },
  unhide(el){ delete S.prefs.hide[el.dataset.id]; save(); openPicker(pickerSlot); },
  delCustom(el){ if(!confirm('Διαγραφή αυτού του γεύματος;')) return; S.custom=S.custom.filter(c=>c.id!==el.dataset.id); Object.values(S.days).forEach(d=>{ Object.keys(d.plan||{}).forEach(s=>{ if(d.plan[s]===el.dataset.id) delete d.plan[s]; }); }); save(); openPicker(pickerSlot); render(); },
  addExtra(el){ openExtra(el.dataset.mode); },
  quickCustom(el){ const c=S.custom.find(x=>x.id===el.dataset.id); if(!c) return; mutate(()=>{ day(viewDate).extras.push({n:c.n,kcal:c.kcal,p:c.p||0}); }); closeSheet(); toast('Προστέθηκε'); },
  delExtra(el){ mutate(()=>{ day(viewDate).extras.splice(Number(el.dataset.i),1); }); },
  exDone(){ mutate(()=>{ const d=day(viewDate), e=exFor(viewDate); d.ex={id:e.id,done:!e.done}; }); if(exFor(viewDate).done) toast('Μπράβο! 💪 +500 ml στον στόχο νερού'); },
  exPick(){ openExPicker(); },
  exChoose(el){ mutate(()=>{ const d=day(viewDate); d.ex={id:el.dataset.id,done:!!(d.ex&&d.ex.done)}; }); closeSheet(); },
  delWeight(el){ if(!confirm('Διαγραφή ζυγίσματος;')) return; mutate(()=>{ delete S.days[el.dataset.k].weight; }); },
  delGoal(el){ if(S.goals.length<=1){toast('Κράτα τουλάχιστον έναν στόχο');return;} const g=S.goals.find(x=>x.id===el.dataset.id); if(!confirm(`Αφαίρεση στόχου «${g.label}»;`)) return; mutate(()=>{ S.goals=S.goals.filter(x=>x.id!==el.dataset.id); }); },
  obStart(){ S=normalize({v:1,profile:obDraft,days:{},goals:DEFAULT_GOALS.map(g=>({...g})),prefs:{fav:{},hide:{}},custom:[]}); const k=todayKey(); day(k).weight=obDraft.startWeight; obDraft=null; save(); window._pts=0; tab='today'; render(); confetti(); },
  obBack(){ window._obPrev={...obDraft}; obDraft=null; renderOnboarding(); },
  export(){ exportData(); },
  import(){ $('#importFile').value=''; $('#importFile').click(); },
  reset(){ if(!confirm('Σίγουρα; Θα σβηστούν ΟΛΑ τα δεδομένα από αυτή τη συσκευή.')) return; if(!confirm('Τελευταία ευκαιρία — να τα σβήσω;')) return; try{localStorage.removeItem(KEY)}catch(e){} S=null; closeSheet(); window._obPrev=null; render(); }
};
const FORMS = {
  onboard(form){
    const {r,err}=readProfile(form);
    if(err){ $('#obErr').innerHTML=`<div class="err">${err}</div>`; $('#obErr').scrollIntoView({behavior:'smooth',block:'center'}); return; }
    obDraft={name:r.name,sex:r.sex,age:r.age,height:r.height,startWeight:r.weight,goalWeight:r.goal,activity:r.activity,pace:r.pace,startDate:todayKey(),slots:{b:true,s1:true,l:true,s2:true,d:true},kcalOverride:null};
    renderOnboarding(); window.scrollTo({top:0});
  },
  settings(form){
    const {r,err}=readProfile(form);
    if(err){ $('#setErr').innerHTML=`<div class="err">${err}</div>`; $('#sheetBody').parentElement.scrollTo({top:0,behavior:'smooth'}); return; }
    const f=new FormData(form), ov=num(f.get('kcalOverride'));
    const slots={}; SLOTS.forEach(s=>slots[s.id]=!!f.get('slot_'+s.id));
    if(!Object.values(slots).some(Boolean)){ $('#setErr').innerHTML='<div class="err">Άφησε ανοιχτό τουλάχιστον ένα γεύμα.</div>'; return; }
    mutate(()=>{
      const p=S.profile; Object.assign(p,{name:r.name,sex:r.sex,age:r.age,height:r.height,goalWeight:r.goal,activity:r.activity,pace:r.pace,slots,kcalOverride:ov>0?ov:null});
      if(Math.abs(r.weight-currentWeight())>=0.05) day(todayKey()).weight=r.weight;
    });
    closeSheet(); toast('Αποθηκεύτηκε ✓');
  },
  weight(form){
    const w=num(new FormData(form).get('w'));
    if(!(w>=30&&w<=300)){ toast('Βάλε το βάρος σε κιλά, π.χ. 67,4'); return; }
    mutate(()=>{ day(viewDate).weight=Math.round(w*10)/10; });
    toast(w<=S.profile.goalWeight?'ΣΤΟΧΟΣ! 🎉🦋':'Καταγράφηκε ✓'); if(w<=S.profile.goalWeight) confetti();
  },
  extra(form){
    const f=new FormData(form), n=String(f.get('n')||'').trim(), kcal=num(f.get('kcal')), p=num(f.get('p'))||0;
    if(!n){ $('#exErr').innerHTML='<div class="err">Γράψε τι ήταν.</div>'; return; }
    if(!(kcal>=0&&kcal<=5000)){ $('#exErr').innerHTML='<div class="err">Βάλε θερμίδες (έστω μια εκτίμηση).</div>'; return; }
    const mode=form.dataset.mode;
    if(mode==='custom'||f.get('keep')) S.custom.push({id:'c_'+uid(),n,kcal:Math.round(kcal),p:Math.round(p),e:'⭐'});
    if(mode==='custom'){ save(); openPicker(pickerSlot); toast('Αποθηκεύτηκε στα «Δικά μου»'); return; }
    mutate(()=>{ day(viewDate).extras.push({n,kcal:Math.round(kcal),p:Math.round(p)}); });
    closeSheet(); toast('Προστέθηκε');
  },
  goal(form){
    const f=new FormData(form), label=String(f.get('label')||'').trim();
    if(!label){ toast('Γράψε τον στόχο'); return; }
    mutate(()=>{ S.goals.push({id:'g_'+uid(),icon:f.get('icon')||'⭐',label,type:'manual'}); });
    toast('Νέος στόχος ✓');
  }
};
async function exportData(){
  const json=JSON.stringify(S), name=`petalouda-${todayKey()}.json`;
  const blob=new Blob([json],{type:'application/json'});
  try{ const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Αντίγραφο Πεταλούδας'}); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500); toast('Το αντίγραφο κατέβηκε');
}
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const s=JSON.parse(rd.result); if(!s||!s.profile||!s.days) throw 0;
      if(!confirm('Να αντικαταστήσω τα τωρινά δεδομένα με το αντίγραφο;')) return;
      S=normalize(s); save(); closeSheet(); viewDate=todayKey(); render(); toast('Τα δεδομένα επανήλθαν ✓');
    }catch(err){ toast('Αυτό δεν μοιάζει με αντίγραφο της Πεταλούδας'); } };
  rd.readAsText(file);
});
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const fn=A[el.dataset.act]; if(fn){ e.preventDefault(); fn(el,e); } });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault(); const fn=FORMS[f.dataset.form]; if(fn) fn(f); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
// Αν η εφαρμογή μείνει ανοιχτή και αλλάξει η μέρα, πήγαινε στη νέα μέρα
let lastToday=todayKey();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S){ const t=todayKey(); if(t!==lastToday){ if(viewDate===lastToday) viewDate=t; lastToday=t; render(); } } });

window._pts = S?points():null;
render();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
